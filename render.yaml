# Render Blueprint: AgentTrust hosted evaluation sandbox.
# Sandbox only: simulated payment provider, development persona logins, no real money.
# Deploys from `main` (production branch = tagged releases). See docs/HOSTED_SANDBOX.md.
databases:
  - name: agenttrust-sandbox-db
    databaseName: agenttrust
    user: agenttrust
    # Free Render Postgres instances expire after 30 days; use a paid plan for anything you share.
    plan: basic-256mb

services:
  - type: web
    name: agenttrust-sandbox
    runtime: docker
    dockerfilePath: ./Dockerfile
    branch: main
    autoDeploy: true
    # The free web plan sleeps after inactivity (~1 min cold start), which ruins a timed evaluation.
    plan: starter
    healthCheckPath: /v1/health
    envVars:
      - key: NODE_ENV
        value: sandbox
      - key: DATABASE_URL
        fromDatabase:
          name: agenttrust-sandbox-db
          property: connectionString
      - key: AGENTTRUST_SIGNING_KEY_ID
        value: hosted-sandbox-1
      # Random 256-bit values generated by Render once, at creation.
      - key: AGENTTRUST_SIGNING_KEY_SEED
        generateValue: true
      - key: AGENTTRUST_PAYEE_PEPPER
        generateValue: true
      - key: AGENTTRUST_BOOTSTRAP_TOKEN
        generateValue: true
      - key: AGENTTRUST_DEV_AUTH
        value: "true"
      - key: AGENTTRUST_DEV_AUTH_SECRET
        generateValue: true
      - key: AGENTTRUST_SANDBOX_WEBHOOK_SECRET
        generateValue: true
      - key: AGENTTRUST_SANDBOX_SIGNUP
        value: "true"
      - key: AGENTTRUST_SANDBOX_MAX_SIGNUPS_PER_DAY
        value: "100"
      - key: AGENTTRUST_SANDBOX_TTL_DAYS
        value: "30"
      # Render terminates TLS at one proxy hop; rate limits must key on the real client IP.
      - key: AGENTTRUST_TRUST_PROXY
        value: "1"
      - key: AGENTTRUST_PUBLIC_DOCS
        value: "true"
      # Set after the first deploy to the service URL (or your custom domain), e.g. https://agenttrust-sandbox.onrender.com
      - key: AGENTTRUST_PUBLIC_URL
        sync: false
