name: ci

on:
  push:
    branches: [main, develop, 'feature/**', 'fix/**', 'chore/**', 'release/**', 'hotfix/**']
  pull_request:
    branches: [main, develop]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: agenttrust
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: agenttrust_test
        ports: ["54329:5432"]
        options: >-
          --health-cmd "pg_isready -U agenttrust" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm setup:env
      - run: pnpm --filter @agenttrust/api run db:migrate:test
      - run: pnpm typecheck
      # Security-critical tests: any failure blocks merge/release.
      - run: pnpm test
      # Python SDK: cross-language signing vectors + live suite against the built API.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install "cryptography>=41" "pytest>=8"
      - run: pnpm build
      - run: PYTHON=python pnpm test:python

  # Releases to main must come from release/* or hotfix/* branches.
  main-source-guard:
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Only release/* or hotfix/* may merge into main
        run: |
          case "${{ github.head_ref }}" in
            release/*|hotfix/*) echo "ok: ${{ github.head_ref }}";;
            *) echo "::error::main accepts merges only from release/* or hotfix/* (got ${{ github.head_ref }})"; exit 1;;
          esac
