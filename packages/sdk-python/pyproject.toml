[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "agenttrust"
version = "0.4.0"
description = "AgentTrust SDK: authorization for AI agents that initiate business payments (sandbox)."
readme = "README.md"
license = { file = "LICENSE.md" }
requires-python = ">=3.9"
dependencies = ["cryptography>=41"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Typing :: Typed",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.hatch.build.targets.wheel]
packages = ["src/agenttrust"]

[tool.hatch.build.targets.sdist]
include = ["src/agenttrust", "README.md", "LICENSE.md", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
